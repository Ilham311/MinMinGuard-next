name: Build APK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'images/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'images/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Terbitkan GitHub Release dengan APK release yang ditandatangani'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Jangan batalkan penerbitan rilis yang sedang berjalan: baik dari tag
  # maupun dari workflow_dispatch dengan publish_release=true.
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.event.inputs.publish_release != 'true' }}

permissions:
  contents: read

jobs:
  # Always builds a debug APK so pull requests (which get no secrets) and
  # forks still produce something installable.
  debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read module version
        id: version
        run: |
          set -eu
          VERSION=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from app/build.gradle"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APK name: MinMinGuard-next-$VERSION-debug.apk"

      - name: Build debug
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MinMinGuard-next-debug-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
          retention-days: 14

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/MinMinGuard-next-${{ steps.version.outputs.name }}-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MinMinGuard-next-debug
          path: dist/MinMinGuard-next-${{ steps.version.outputs.name }}-debug.apk
          if-no-files-found: error
          retention-days: 30

  # Signed release APK. Secrets are not available to pull requests from forks,
  # so this job is skipped there instead of failing.
  release:
    name: Assemble signed release APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          if [ -z "${KEYSTORE_PASS:-}" ] || [ -z "${KEY_PASS:-}" ]; then
            echo "::error::KEYSTORE_PASS / KEY_PASS secrets are not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/minminguard.keystore"
          chmod 600 "$RUNNER_TEMP/minminguard.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/minminguard.keystore" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read module version
        id: version
        run: |
          set -eu
          VERSION=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read versionName from app/build.gradle"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APK name: MinMinGuard-next-$VERSION-release.apk"

      # Gerbang rilis: regresi hook 3.1.3 lolos ke rilis dengan CI hijau karena
      # tidak ada satu pun tes. Jalankan sebelum APK ditandatangani.
      - name: Run unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build release
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify signature
        run: |
          set -eu
          APK=app/build/outputs/apk/release/app-release.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" | head -5
          "$BT/apksigner" verify --verbose "$APK" | grep -E '^(Verifies|Verified using)' | head -5

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/MinMinGuard-next-${{ steps.version.outputs.name }}-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MinMinGuard-next-release
          path: dist/MinMinGuard-next-${{ steps.version.outputs.name }}-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/minminguard.keystore"

  # Menerbitkan GitHub Release berisi APK. Dipicu oleh tag `v*` atau manual
  # (workflow_dispatch dengan publish_release=true). Tanpa job ini workflow
  # hanya menyimpan artifact sementara dan halaman Releases tetap kosong.
  publish:
    name: Publish GitHub Release
    needs: [ debug, release ]
    if: >-
      always()
      && needs.debug.result == 'success'
      && needs.release.result == 'success'
      && (startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch'
              && github.event.inputs.publish_release == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: meta
        run: |
          set -eu
          VERSION=$(sed -n 's/.*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)
          if [ -z "$VERSION" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle"
            exit 1
          fi
          EXPECTED_TAG="v$VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            if [ "$TAG" != "$EXPECTED_TAG" ]; then
              echo "::error::Tag $TAG does not match versionName $VERSION (expected $EXPECTED_TAG)"
              exit 1
            fi
          else
            TAG="$EXPECTED_TAG"
            # Dispatch pada branch: kalau tag tujuan sudah menunjuk commit lain,
            # APK yang baru dibangun tidak mewakili isi tag itu.
            if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
              TAG_SHA=$(git rev-list -n1 "refs/tags/$TAG")
              if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
                echo "::error::Tag $TAG already points to $TAG_SHA, not the built commit $GITHUB_SHA. Bump versionName or push the tag instead."
                exit 1
              fi
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (versionCode $VERSION_CODE)"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: MinMinGuard-next-release
          path: dist

      - name: Prepare assets and checksums
        run: |
          set -eu
          ls -l dist
          APK="dist/MinMinGuard-next-${{ steps.meta.outputs.version }}-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Signed release APK not found: $APK"
            exit 1
          fi
          # Nama stabil supaya tautan unduhan tidak berubah tiap versi.
          cp "$APK" "dist/MinMinGuard-next-release.apk"
          ( cd dist && sha256sum -- *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Write release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
        run: |
          set -eu
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "MinMinGuard-next **$VERSION** (versionCode $VERSION_CODE)."
            echo
            echo "## Unduhan"
            echo
            echo "- \`MinMinGuard-next-release.apk\` — selalu berkas versi terbaru, bertanda tangan."
            echo "- \`MinMinGuard-next-$VERSION-release.apk\` — berkas versi ini, isinya sama."
            echo "- \`SHA256SUMS.txt\` — checksum kedua APK di atas."
            echo
            echo "## Pemasangan"
            echo
            echo "1. Pasang APK di atas versi sebelumnya (tanda tangan sama, jadi pembaruan biasa)."
            echo "2. Aktifkan modul di LSPosed, lalu centang aplikasi yang ingin diblokir."
            echo "3. Reboot perangkat."
            echo
            echo "Terdapat satu saklar saja: scope LSPosed. Aplikasi yang tidak dicentang tidak"
            echo "pernah dimuat oleh modul."
            echo
            echo "APK ini dibangun dan ditandatangani oleh CI dari commit tag \`$TAG\`."
            echo
            echo "## Perubahan"
            echo
            # Titik acuan: tag rilis ini kalau sudah ada (push tag), kalau tidak
            # commit yang sedang dibangun.
            if git rev-parse --verify --quiet "$TAG" >/dev/null; then
              BASE="$TAG"
              RANGE="$TAG"
            else
              BASE="HEAD"
              RANGE="HEAD"
            fi
            PREV=$(git describe --tags --abbrev=0 --match 'v*' "$BASE^" 2>/dev/null || true)
            if [ -n "$PREV" ]; then
              RANGE="$PREV..$BASE"
              echo "Sejak \`$PREV\`:"
              echo
              ENTRIES=$(git log --no-merges --pretty='- %s' "$RANGE" 2>/dev/null | head -40 || true)
              if [ -n "$ENTRIES" ]; then
                printf '%s\n' "$ENTRIES"
              else
                echo "- Tidak ada commit baru."
              fi
            else
              # Rilis pertama: seluruh riwayat commit hanya akan jadi derau.
              echo "Rilis pertama; lihat bagian \"What changed in $VERSION\" di README"
              echo "untuk ringkasan perubahannya."
            fi
          } > "$NOTES"
          echo "--- notes ---"
          cat "$NOTES"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -eu
          TITLE="MinMinGuard-next $VERSION"
          NOTES="$RUNNER_TEMP/notes.md"
          ASSETS=(dist/MinMinGuard-next-release.apk dist/MinMinGuard-next-"$VERSION"-release.apk dist/SHA256SUMS.txt)

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # Tag dari push sudah ada di remote; hanya dispatch yang perlu
            # dibuatkan tag baru, dan harus menunjuk commit yang dibangun.
            EXTRA=()
            if [ "$REF_TYPE" != "tag" ]; then
              EXTRA=(--target "$GITHUB_SHA")
            fi
            if gh release create "$TAG" "${ASSETS[@]}" \
                 ${EXTRA[@]+"${EXTRA[@]}"} \
                 --title "$TITLE" \
                 --notes-file "$NOTES" \
                 --latest; then
              echo "Created release $TAG."
              exit 0
            fi
            echo "::warning::Could not create release $TAG (draft or race?); trying to update it instead."
          fi

          # Sudah ada (job dijalankan ulang): timpa aset dan catatan.
          echo "Updating existing release $TAG."
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --latest

      - name: Release summary
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          {
            echo "### Rilis $TAG diterbitkan"
            echo
            gh release view "$TAG" --json url,assets \
              --jq '"\(.url)\n\n" + (.assets[] | "- \(.name) (\(.size) byte)")'
          } >> "$GITHUB_STEP_SUMMARY"
