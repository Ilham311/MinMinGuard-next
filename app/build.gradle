apply plugin: 'com.android.application'

repositories {
    maven { url 'https://jitpack.io' }
    mavenCentral()
    google()
}

android {
    namespace 'tw.fatminmin.xposed.minminguard.next'
    compileSdk 36

    signingConfigs {
        release {
            // CI writes the keystore decoded from the KEYSTORE_BASE64 secret to
            // $RUNNER_TEMP and points KEYSTORE_PATH at it; local builds fall
            // back to the checked-in keystore.
            def keystorePath = System.getenv("KEYSTORE_PATH")
            storeFile keystorePath ? file(keystorePath) : file('minminguard.keystore')
            storePassword System.getenv("KEYSTORE_PASS")
            keyAlias System.getenv("KEY_ALIAS") ?: 'minminguard'
            keyPassword System.getenv("KEY_PASS")
        }
        debug {
            storeFile file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    defaultConfig {
        applicationId "tw.fatminmin.xposed.minminguard.next"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 73
        versionName "3.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // zipalign is applied automatically by AGP for release builds
            // (zipAlignEnabled was removed from the DSL in AGP 9)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // AGP 8 no longer generates BuildConfig by default, but Common.java
        // uses BuildConfig.APPLICATION_ID.
        buildConfig = true
    }

    lint {
        abortOnError false
        disable 'MissingTranslation'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.github.apl-devs:appintro:v4.2.3'

    //Glide
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.9.0'
    annotationProcessor 'androidx.annotation:annotation:1.1.0'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
