apply plugin: 'com.android.application'

repositories {
    mavenCentral()
    google()
}

android {
    namespace 'tw.fatminmin.xposed.minminguard.next'
    compileSdk 36

    signingConfigs {
        release {
            // CI writes the keystore decoded from the KEYSTORE_BASE64 secret to
            // $RUNNER_TEMP and points KEYSTORE_PATH at it; local builds fall
            // back to the checked-in keystore.
            def keystorePath = System.getenv("KEYSTORE_PATH")
            storeFile keystorePath ? file(keystorePath) : file('minminguard.keystore')
            storePassword System.getenv("KEYSTORE_PASS")
            keyAlias System.getenv("KEY_ALIAS") ?: 'minminguard'
            keyPassword System.getenv("KEY_PASS")
        }
        debug {
            storeFile file("debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    defaultConfig {
        applicationId "tw.fatminmin.xposed.minminguard.next"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 77
        versionName "4.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // zipalign is applied automatically by AGP for release builds
            // (zipAlignEnabled was removed from the DSL in AGP 9)
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            debuggable true
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        // AGP 8 no longer generates BuildConfig by default, but Common.java
        // uses BuildConfig.APPLICATION_ID.
        buildConfig = true
    }

    lint {
        abortOnError false
        disable 'MissingTranslation'
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.google.android.material:material:1.12.0'

    // Glide 4.9.0 masih memakai com.android.support di AAR-nya, sehingga
    // Jetifier tidak bisa dimatikan selama versi itu dipakai. 4.16.0 sudah
    // AndroidX penuh; API model loader yang dipakai di sini tidak berubah.
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'

    // Tes JVM untuk logika murni (hook traversal, blocklist, plan jaringan).
    // Tidak ada tes di sini sampai 4.0.0, dan itulah sebabnya regresi hook
    // di 3.1.3 bisa lolos ke rilis dengan CI hijau.
    testImplementation 'junit:junit:4.13.2'
}
